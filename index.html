<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
        }
        /* 导航栏 */
        nav {
            position: fixed;
            width: 100%;
            padding: 1.2rem 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15,23,42,0.85);
            backdrop-filter: blur(8px);
            z-index: 999;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(90deg,#38bdf8,#a855f7);
            -webkit-background-clip: text;
            color: transparent;
        }
        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 2rem;
            transition: 0.3s;
        }
        .nav-links a:hover {
            color: #a855f7;
        }
        /* 首页横幅 */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 2rem;
        }
        .hero h1 {
            font-size: clamp(2.5rem,6vw,4rem);
            margin-bottom: 1rem;
        }
        .hero p {
            font-size: 1.2rem;
            color: #94a3b8;
            max-width: 700px;
            margin-bottom: 2rem;
        }
        .btn {
            padding: 0.9rem 2rem;
            background: linear-gradient(90deg,#38bdf8,#a855f7);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(168,85,247,0.3);
        }
        /* 区块通用 */
        section {
            padding: 6rem 10%;
        }
        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 3rem;
        }
        /* 卡片区域 */
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px,1fr));
            gap: 2rem;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 16px;
            transition: 0.3s;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }
        .card h3 {
            margin-bottom: 0.8rem;
            color: #38bdf8;
        }
        .card p {
            color: #94a3b8;
        }
        /* 底部 */
        footer {
            text-align: center;
            padding: 2rem;
            background: #0b1120;
            color: #64748b;
        }
        /* 移动端适配 */
        @media(max-width:768px){
            .nav-links a {
                margin-left:1rem;
            }
            nav {
                padding:1rem 5%;
            }
        }
    </style>
</head>
<body>
    <!--导航-->
    <nav>
        <div class="logo">MySite</div>
        <div class="nav-links">
            <a href="#home">首页</a>
            <a href="#about">关于</a>
            <a href="#works">项目</a>
            <a href="#contact">联系</a>
        </div>
    </nav>

    <!--首页-->
    <section class="hero" id="home">
        <h1>你好，欢迎来到我的网站</h1>
        <p>桑雨晨是日本猪、缉毒犬</p>
        <a href="#works" class="btn">查看我的项目</a>
    </section>

    <!--关于我-->
    <section id="about">
        <h2 class="section-title">关于我</h2>
        <div class="card-container">
            <div class="card">
                <h3>✨ 设计</h3>
                <p>简洁美观的页面布局，注重用户视觉体验，色彩柔和不刺眼。</p>
            </div>
            <div class="card">
                <h3>💻 开发</h3>
                <p>原生HTML+CSS编写，无复杂框架，代码简单易懂，方便二次修改。</p>
            </div>
            <div class="card">
                <h3>📱 响应式</h3>
                <p>自动适配手机、平板、电脑，在任何设备都可以正常浏览。</p>
            </div>
        </div>
    </section>

    <!--项目展示-->
    <section id="works">
        <h2 class="section-title">项目展示</h2>
        <div class="card-container">
            <div class="card">
                <h3>项目一号</h3>
                <p>没有任何项目。</p>
            </div>
            <div class="card">
                <h3>项目二号</h3>
                <p>依然没有任何项目。</p>
            </div>
        </div>
    </section>

    <!--联系-->
    <section id="contact">
        <h2 class="section-title">联系我</h2>
        <div style="text-align:center;max-width:600px;margin:0 auto;">
            <p style="font-size:1.1rem;color:#94a3b8;">邮箱：1989644340@qq.com</p>
            <p style="font-size:1.1rem;color:#94a3b8;margin-top:10px;">QQ：1989644340</p>
        </div>
    </section>

    <footer>
        <p>© 2026 My Website | 全部代码开源可修改</p>
    </footer>
</body>
</html>
